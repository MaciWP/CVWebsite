<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Senior Software Developer with over 6 years of experience in backend development, API design, and infrastructure management."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oriol Macias Badosa - Senior Software Developer</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        style-src 'self' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data:;
        script-src 'self';
        connect-src 'self' https://api.github.com;
      "
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap"
      as="style"
      onload="this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <link rel="canonical" href="https://oriolmacias.dev" />
    <script>
      fetch("%PUBLIC_URL%/asset-manifest.json")
        .then((r) => r.json())
        .then((m) => {
          const files = m.files || {};
          const head = document.head;
          if (files["main.css"]) {
            const linkCss = document.createElement("link");
            linkCss.rel = "preload";
            linkCss.href = files["main.css"];
            linkCss.as = "style";
            head.appendChild(linkCss);
          }
          const photoKey = Object.keys(files).find((k) =>
            k.endsWith("photo.webp"),
          );
          if (photoKey) {
            const linkImg = document.createElement("link");
            linkImg.rel = "preload";
            linkImg.href = files[photoKey];
            linkImg.as = "image";
            head.appendChild(linkImg);
          }
        })
        .catch((e) => console.error("preload", e));
    </script>
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
